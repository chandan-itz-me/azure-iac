name: module-docs

on:
  push:
    branches: [main]
    paths:
      - "modules/**/*.tf"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  terraform-docs:
    name: generate module docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Render terraform-docs
        uses: terraform-docs/gh-actions@v1.3.0
        with:
          working-dir: modules
          recursive: true
          recursive-path: ""
          output-file: README.md
          output-method: inject
          git-push: true
          git-commit-message: "docs: auto-generate module documentation"
